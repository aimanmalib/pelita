# Pelita site (rendered by deploy/stamp.py: @CONNECT_SRC@ = origins of the active chains' RPCs in config/chains.json).
# Headers sit in one include because add_header inside a location drops the ones inherited from the server block.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;
    charset utf-8;
    absolute_redirect off;

    location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }

    # HTML: revalidate every time; no-transform keeps the CDN from rewriting it (no injected beacon), traefik compresses.
    location = / { include /etc/nginx/conf.d/pelita.headers; add_header Cache-Control "no-cache, no-transform" always; try_files /index.html =404; }
    location = /index.html { include /etc/nginx/conf.d/pelita.headers; add_header Cache-Control "no-cache, no-transform" always; }

    # Live data written by the indexer, mounted read-only. ^~ = the .json rule below never takes it over.
    location ^~ /data/ {
        alias /data/;
        include /etc/nginx/conf.d/pelita.headers;
        add_header Cache-Control "no-store" always;
    }

    # Settings and text read at run time.
    location ~ \.json$ { include /etc/nginx/conf.d/pelita.headers; add_header Cache-Control "no-cache" always; }

    # Scripts and styles carry ?v=<hash of every served file> (deploy/deploy.sh + stamp.py), so a change always gets a new URL.
    location ~ \.(js|css)$ { include /etc/nginx/conf.d/pelita.headers; add_header Cache-Control "public, max-age=3600" always; }

    location / { include /etc/nginx/conf.d/pelita.headers; add_header Cache-Control "public, max-age=86400" always; try_files $uri =404; }
}
