<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Pelita demo stage</title>
<!-- Pelita demo video, landscape 1920x1080. Every frame is a pure function of t (vp kit). Real captures from tangkap.py;
     numbers on screen come from garis.json "teks", which is copied from docs/measured.md. -->
<link rel="stylesheet" href="pentas.css">
<style>
@font-face{font-family:Newsreader;src:url(aset/newsreader.woff2) format('woff2');font-weight:300 800}
@font-face{font-family:'Public Sans';src:url(aset/public-sans.woff2) format('woff2');font-weight:300 800}
@font-face{font-family:'Plex Mono';src:url(aset/ibm-plex-mono-400.woff2) format('woff2')}
:root{--latar:#14100c;--aksen:#f2a93b;--aksen-t:#ffd38a;--teks:#f1e6d6;--kabur:#bcab94;--garis:#3a2f24;--ash:#6f665b}
#p{font-family:'Public Sans',system-ui,sans-serif;background:radial-gradient(ellipse at 50% 40%,#1f1810 0,#0f0c09 70%)}
.kicker{font-family:'Plex Mono',monospace;letter-spacing:.18em;color:var(--aksen);text-transform:uppercase}
.serif{font-family:Newsreader,Georgia,serif;font-weight:400;letter-spacing:-.01em;color:var(--teks)}
.mono{font-family:'Plex Mono',monospace}
.bingkai{position:absolute;overflow:hidden;border-radius:18px;border:1px solid var(--garis);background:var(--latar);box-shadow:0 30px 80px rgba(0,0,0,.55)}
.bingkai img{position:absolute;left:0;top:0;transform-origin:0 0}
.label{position:absolute;font-family:'Plex Mono',monospace;font-size:30px;color:var(--teks);background:rgba(15,12,9,.92);border:1px solid rgba(242,169,59,.42);border-radius:12px;padding:14px 24px}
.lamp{position:absolute}
.lamp .body{fill:#4a433b}.lamp.lit .body{fill:#d9c9b0}
.lamp .flame{fill:var(--aksen)}.lamp .core{fill:var(--aksen-t)}
.besar{font-family:Newsreader,Georgia,serif;color:var(--aksen-t);line-height:1}
.kecil{color:var(--kabur);font-size:28px}
</style></head>
<body><div id="p"></div>
<script src="data.js"></script>
<script src="pentas.js"></script>
<script>
const LAMP = '<svg viewBox="0 0 24 24" width="100%" height="100%"><path class="body" d="M2.5 13.6h12.4c1.7 0 3.1-.5 4.4-1.5l1.6-1.2-.5 2.1c-.9 3.6-4.1 6.2-7.9 6.2H8.3c-3.2 0-5.8-2.4-5.8-5.6Z"/><path class="body" d="M8 20.6h6.4l.8 1.9H7.2Z"/><g class="fl"><path class="flame" d="M20.2 2.6c1.9 2.3 2.9 4.2 2.9 5.7a2.9 2.9 0 0 1-5.8 0c0-1.5 1-3.4 2.9-5.7Z"/><path class="core" d="M20.2 6.4c.8 1 1.2 1.8 1.2 2.4a1.2 1.2 0 0 1-2.4 0c0-.6.4-1.4 1.2-2.4Z"/></g></svg>';
function lampu(ibu, x, y, s) { const e = el('div', 'lamp', {left: px(x), top: px(y), width: px(s), height: px(s)}, LAMP, ibu); e._fl = e.querySelector('.fl'); return e; }
function nyala(e, k) { e.classList.toggle('lit', k > .5); e._fl.style.opacity = k; }
// A captured page in a rounded frame; cam(t-driven) sets zoom and the css-px point shown at the frame centre.
function tangkapan(ibu, src, cssW, L) { const f = el('div', 'bingkai', {left: px(L.x), top: px(L.y), width: px(L.w), height: px(L.h)}, null, ibu);
  const im = el('img', '', {width: px(cssW)}, null, f); im.src = 'aset/' + src + '.png';
  return {f, cam(z, cx, cy) { const s = z * L.w / cssW; im.style.transform = `translate(${L.w / 2 - cx * s}px,${L.h / 2 - cy * s}px) scale(${s})`; }}; }
const N = G.babak, KK = (t, id, a = .45, b = .35) => babakK(t, N[id], a, b);
const kamera = (t, a, b, A, Bp) => { const k = eio(pr(t, a, b)); return A.map((v, i) => lerp(v, Bp[i], k)); };
const debu = debuCahaya({rgb: '242,169,59', n: 70});

// 1 HOOK: census grid (116 contracts that went dark, 97 still dark; docs/measured.md H8)
const bHook = el('div', 'b');
el('div', 'kicker', {position: 'absolute', left: '160px', top: '110px', fontSize: '26px'}, X.hook_kicker, bHook);
const grid = [], KOL = 29;
for (let i = 0; i < 116; i++) grid.push(lampu(bHook, 160 + (i % KOL) * 55, 190 + Math.floor(i / KOL) * 62, 46));
const hA = el('div', '', {position: 'absolute', left: '160px', top: '480px'}, null, bHook);
const hB = el('div', '', {position: 'absolute', left: '760px', top: '480px'}, null, bHook);
const nA = el('div', 'besar', {fontSize: '220px'}, '', hA); el('div', 'kecil', {fontSize: '40px'}, X.hook_a, hA);
const nB = el('div', 'besar', {fontSize: '220px', color: 'var(--kabur)'}, '', hB); el('div', 'kecil', {fontSize: '40px'}, X.hook_b, hB);
// fixed pseudo-random order in which lamps go dark; the 19 that came back stay lit at the end
let r = 11; const urut = grid.map((_, i) => i).sort(() => ((r = r * 16807 % 2147483647) / 2147483647) - .5);

// 2 MASALAH: one control lamp, dark (H3)
const bMas = el('div', 'b');
const mL = lampu(bMas, 760, 170, 400);
const mH = el('div', 'serif', {position: 'absolute', left: 0, right: 0, top: '640px', textAlign: 'center', fontSize: '96px'}, X.masalah_h, bMas);
const mS = el('div', 'mono', {position: 'absolute', left: 0, right: 0, top: '790px', textAlign: 'center', fontSize: '32px', color: 'var(--kabur)'}, X.masalah_s, bMas);

// 3 PELITA: the live page, then the fleet
const bPel = el('div', 'b');
const pPel = pelayar(bPel, {x: 200, y: 70, w: 1520, h: 840}, X.url_bar);
const peHero = tangkapan(pPel.view, 'd-hero', 1280, {x: 0, y: 0, w: 1520, h: 788});
const peFleet = tangkapan(pPel.view, 'd-fleet', 1152, {x: 0, y: 0, w: 1520, h: 788});

// 4 GELUNG: outage -> Keeper reaction -> lit, on the explorer
const bGel = el('div', 'b');
const gX1 = tangkapan(bGel, 'x-padam', 1280, {x: 160, y: 80, w: 1600, h: 780});
const gX2 = tangkapan(bGel, 'x-reaksi', 1280, {x: 160, y: 80, w: 1600, h: 780});
const gF = tangkapan(bGel, 'd-fleet', 1152, {x: 160, y: 80, w: 1600, h: 780});
const gL = [X.l1, X.l2, X.l3].map(s => el('div', 'label', {left: '210px', top: '740px'}, s, bGel));

// 5 BASE: callback on Blockscout, then the control Lantern
const bBas = el('div', 'b');
const bX = tangkapan(bBas, 'x-callback', 1280, {x: 160, y: 80, w: 1600, h: 780});
const bF = tangkapan(bBas, 'd-fleet', 1152, {x: 160, y: 80, w: 1600, h: 780});
const bL = [X.lb1, X.lb2].map(s => el('div', 'label', {left: '210px', top: '740px'}, s, bBas));

// 6 BUKTI: measured table (H1, H2)
const bBuk = el('div', 'b');
el('div', 'kicker', {position: 'absolute', left: '200px', top: '150px', fontSize: '26px'}, X.bukti_kicker, bBuk);
const kol = [['52', X.b_l, '52 ' + X.b_r], ['17', X.b_b, '17 ' + X.b_r], ['1 s', X.b_m, '2 s ' + X.b_s]].map(([n, a, b], i) => {
  const c = el('div', '', {position: 'absolute', left: px(200 + i * 540), top: '250px', width: '480px'}, null, bBuk);
  el('div', 'besar', {fontSize: '200px'}, n, c); el('div', 'kecil', {fontSize: '36px', marginTop: '18px', color: 'var(--teks)'}, a, c);
  el('div', 'mono', {fontSize: '28px', marginTop: '14px', color: 'var(--aksen)'}, b, c); return c; });

// 7 LAMAN: fuel gauge, then the dark list
const bLam = el('div', 'b');
const pLam = pelayar(bLam, {x: 200, y: 70, w: 1520, h: 840}, X.url_bar + '#gauge');
const lG = tangkapan(pLam.view, 'd-gauge', 1152, {x: 0, y: 0, w: 1520, h: 788});
const lD = tangkapan(pLam.view, 'd-dark', 1152, {x: 0, y: 0, w: 1520, h: 788});

// 8 KOS: how it works + cost (H5)
const bKos = el('div', 'b');
const kH = tangkapan(bKos, 'd-how', 1152, {x: 260, y: 230, w: 1400, h: 620});
const kT = el('div', 'serif', {position: 'absolute', left: 0, right: 0, top: '80px', textAlign: 'center', fontSize: '96px'}, X.kos_h, bKos);
const kS = el('div', 'mono', {position: 'absolute', left: 0, right: 0, top: '880px', textAlign: 'center', fontSize: '30px', color: 'var(--aksen-t)'}, X.kos_s, bKos);

// 9 TUTUP: end card with disclosure
const bTut = el('div', 'b');
const tL = lampu(bTut, 860, 90, 200);
const tN = el('div', 'serif', {position: 'absolute', left: 0, right: 0, top: '310px', textAlign: 'center', fontSize: '150px'}, X.t_nama, bTut);
const tS = el('div', 'serif', {position: 'absolute', left: 0, right: 0, top: '490px', textAlign: 'center', fontSize: '64px', color: 'var(--aksen-t)', fontStyle: 'italic'}, X.t_slogan, bTut);
const tI = el('div', 'mono', {position: 'absolute', left: 0, right: 0, top: '620px', textAlign: 'center', fontSize: '34px', lineHeight: 1.6, color: 'var(--teks)'},
  `${X.t_url}<br>${X.t_repo}`, bTut);
const tK = el('div', '', {position: 'absolute', left: 0, right: 0, top: '820px', textAlign: 'center', fontSize: '26px', lineHeight: 1.7, color: 'var(--kabur)'},
  `${X.t_aku}<br>${X.t_acara}<br>${X.t_muzik}`, bTut);

const sari = sariKata({semasa: '#ffd38a', lepas: '#f1e6d6', belum: 'rgba(241,230,214,.5)'});
const tunjuk = (e, t, a, b) => { e.style.opacity = Math.min(eo(pr(t, a, a + .35)), 1 - pr(t, b - .3, b)); };

function seek(t) {
  debu(t, .5);
  // hook: from 40 dark at frame 0 to 97 dark; counters follow
  let k; bHook.style.opacity = 1 - pr(t, N.hook[1] - .35, N.hook[1]);  // frame 0 = the census grid, already part dark
  const gelap = Math.round(lerp(40, 97, eo(pr(t, .4, 6.5))));
  urut.forEach((i, n) => nyala(grid[i], n < gelap ? 0 : 1));
  nA.textContent = 116; nB.textContent = gelap;

  k = KK(t, 'masalah'); bMas.style.opacity = k.o; nyala(mL, 0); mL.style.transform = `scale(${.94 + .06 * k.k})`;
  mH.style.opacity = eo(pr(t, N.masalah[0] + .3, N.masalah[0] + .8)); mS.style.opacity = eo(pr(t, N.masalah[0] + .7, N.masalah[0] + 1.2));

  k = KK(t, 'pelita'); bPel.style.opacity = k.o; pPel.w.style.transform = `translateY(${(1 - k.k) * 60}px)`;
  const tf = T.tangki - .3;
  peHero.cam(...kamera(t, N.pelita[0], tf, [1, 640, 394], [1.25, 560, 300]));
  peFleet.f.style.opacity = eo(pr(t, tf, tf + .5));
  peFleet.cam(...kamera(t, tf, N.pelita[1], [1.3, 576, 330], [1.3, 576, 640]));

  k = KK(t, 'gelung'); bGel.style.opacity = k.o;
  gX1.cam(...kamera(t, N.gelung[0], T.dengar, [1, 640, 400], [1.6, 400, 330]));
  gX2.f.style.opacity = eo(pr(t, T.dengar, T.dengar + .4)); gX2.cam(...kamera(t, T.dengar, T.nyala, [1.2, 640, 330], [1.6, 400, 330]));
  gF.f.style.opacity = eo(pr(t, T.nyala, T.nyala + .4)); gF.cam(...kamera(t, T.nyala, N.gelung[1], [1.4, 290, 400], [2, 290, 380]));
  tunjuk(gL[0], t, T.umum, T.dengar); tunjuk(gL[1], t, T.dengar, T.nyala); tunjuk(gL[2], t, T.nyala, N.gelung[1]);

  k = KK(t, 'base'); bBas.style.opacity = k.o;
  bX.cam(...kamera(t, N.base[0], T.kembar, [1, 640, 400], [1.5, 560, 300]));
  bF.f.style.opacity = eo(pr(t, T.kembar, T.kembar + .4)); bF.cam(...kamera(t, T.kembar, N.base[1], [1.5, 870, 830], [2, 870, 800]));
  tunjuk(bL[0], t, N.base[0] + .8, T.kembar); tunjuk(bL[1], t, T.kembar + .3, N.base[1]);

  k = KK(t, 'bukti'); bBuk.style.opacity = k.o;
  kol.forEach((c, i) => { const a = eo(pr(t, N.bukti[0] + .4 + i * 2.4, N.bukti[0] + 1 + i * 2.4)); c.style.opacity = a; c.style.transform = `translateY(${(1 - a) * 40}px)`; });

  k = KK(t, 'laman'); bLam.style.opacity = k.o; pLam.w.style.transform = `translateY(${(1 - k.k) * 60}px)`;
  lG.cam(...kamera(t, N.laman[0], T.senarai, [1.1, 576, 330], [1.15, 576, 400]));
  lD.f.style.opacity = eo(pr(t, T.senarai, T.senarai + .4)); lD.cam(...kamera(t, T.senarai, N.laman[1], [1.2, 576, 560], [1.2, 576, 900]));

  k = KK(t, 'kos'); bKos.style.opacity = k.o; kH.cam(...kamera(t, N.kos[0], N.kos[1], [.96, 560, 320], [1, 560, 340]));
  kT.style.opacity = eo(pr(t, N.kos[0] + .2, N.kos[0] + .7)); kS.style.opacity = eo(pr(t, N.kos[0] + 1.2, N.kos[0] + 1.7));

  const a = N.tutup[0]; bTut.style.opacity = t >= a ? Math.min(eo(pr(t, a, a + .5)), 1 - pr(t, G.video.panjang - .6, G.video.panjang)) : 0;
  nyala(tL, eo(pr(t, a + .6, a + 1.2)) > .02 ? 1 : 0); tL._fl.style.opacity = eo(pr(t, a + .6, a + 1.2));
  tS.style.opacity = eo(pr(t, a + 1, a + 1.5)); tI.style.opacity = eo(pr(t, a + 1.6, a + 2.1)); tK.style.opacity = eo(pr(t, a + 2.2, a + 2.7));
  sari(t);
}
mula(seek);
</script></body></html>
